name: Release Publish

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to publish.
        required: true
        type: string
      packaging_ref:
        description: Optional ref supplying the current packaging harness for a tagged recovery.
        required: false
        type: string
        default: ""
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v2

      - name: Configure 1Password service account
        uses: 1password/load-secrets-action/configure@v3
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load Apple release metadata
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
          unset-previous: true
        env:
          MACOS_NOTARY_ISSUER_ID: op://Automation/Apple Developer App Store Connect AuthKey Github Releases/NOTARY_ISSUER_ID
          MACOS_NOTARY_KEY_ID: op://Automation/Apple Developer App Store Connect AuthKey Github Releases/NOTARY_KEY_ID
          MACOS_SIGN_PASSWORD: op://Automation/Apple Release Signing Developer ID Certificate/password
          HOMEBREW_TAP_GITHUB_TOKEN: op://Automation/GitHub Token for homebrew-tap/token

      - name: Prepare Apple signing payloads
        run: |
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          op read 'op://Automation/Apple Developer App Store Connect AuthKey Github Releases/AuthKey.p8' --out-file "$temp_dir/AuthKey.p8"
          op read 'op://Automation/Apple Release Signing Developer ID Certificate/Apple Release Signing Developer ID Certificate.p12' --out-file "$temp_dir/developer-id.p12"
          openssl pkcs12 -legacy -in "$temp_dir/developer-id.p12" -passin env:MACOS_SIGN_PASSWORD -noout >/dev/null
          macos_notary_key="$(base64 < "$temp_dir/AuthKey.p8" | tr -d "\n")"
          macos_sign_p12="$(base64 < "$temp_dir/developer-id.p12" | tr -d "\n")"
          printf "::add-mask::%s\n" "$macos_notary_key"
          printf "::add-mask::%s\n" "$macos_sign_p12"
          {
            printf "MACOS_NOTARY_KEY=%s\n" "$macos_notary_key"
            printf "MACOS_SIGN_P12=%s\n" "$macos_sign_p12"
          } >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  menubar-app:
    needs: goreleaser
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Use current recovery packaging harness
        if: ${{ inputs.packaging_ref != '' }}
        env:
          PACKAGING_REF: ${{ inputs.packaging_ref }}
        run: |
          git fetch origin "$PACKAGING_REF"
          git show FETCH_HEAD:script/package_macos_app.sh > script/package_macos_app.sh
          chmod +x script/package_macos_app.sh

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Verify Swift toolchain
        run: swift --version

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v2

      - name: Configure 1Password service account
        uses: 1password/load-secrets-action/configure@v3
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load Apple release metadata
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
          unset-previous: true
        env:
          MACOS_NOTARY_ISSUER_ID: op://Automation/Apple Developer App Store Connect AuthKey Github Releases/NOTARY_ISSUER_ID
          MACOS_NOTARY_KEY_ID: op://Automation/Apple Developer App Store Connect AuthKey Github Releases/NOTARY_KEY_ID
          MACOS_SIGN_PASSWORD: op://Automation/Apple Release Signing Developer ID Certificate/password
          HOMEBREW_TAP_GITHUB_TOKEN: op://Automation/GitHub Token for homebrew-tap/token

      - name: Prepare Apple signing keychain
        run: |
          signing_dir="$RUNNER_TEMP/apple-signing"
          keychain="$RUNNER_TEMP/bb-release.keychain-db"
          mkdir -p "$signing_dir"
          op read 'op://Automation/Apple Developer App Store Connect AuthKey Github Releases/AuthKey.p8' --out-file "$signing_dir/AuthKey.p8"
          op read 'op://Automation/Apple Release Signing Developer ID Certificate/Apple Release Signing Developer ID Certificate.p12' --out-file "$signing_dir/developer-id.p12"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$signing_dir/developer-id.p12" -k "$keychain" -P "$MACOS_SIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "Developer ID Application identity not found" >&2
            exit 1
          fi
          {
            printf 'MACOS_SIGN_IDENTITY=%s\n' "$identity"
            printf 'MACOS_NOTARY_KEY_PATH=%s\n' "$signing_dir/AuthKey.p8"
          } >> "$GITHUB_ENV"

      - name: Prepare app release paths
        id: app
        run: |
          tag="$(git describe --tags --exact-match)"
          version="${tag#v}"
          output_dir="$RUNNER_TEMP/release"
          mkdir -p "$output_dir"
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'output_dir=%s\n' "$output_dir"
          } >> "$GITHUB_OUTPUT"

      - name: Test Swift app
        run: script/package_macos_app.sh --stage test --version "${{ steps.app.outputs.version }}" --output-dir "${{ steps.app.outputs.output_dir }}"

      - name: Build universal app bundle
        run: script/package_macos_app.sh --stage build --version "${{ steps.app.outputs.version }}" --output-dir "${{ steps.app.outputs.output_dir }}"

      - name: Sign app bundle
        run: script/package_macos_app.sh --stage sign --version "${{ steps.app.outputs.version }}" --output-dir "${{ steps.app.outputs.output_dir }}"

      - name: Notarize and staple app bundle
        run: script/package_macos_app.sh --stage notarize --version "${{ steps.app.outputs.version }}" --output-dir "${{ steps.app.outputs.output_dir }}"

      - name: Archive notarized app
        id: package
        run: |
          archive="$(script/package_macos_app.sh --stage archive --version "${{ steps.app.outputs.version }}" --output-dir "${{ steps.app.outputs.output_dir }}")"
          checksum="$archive.sha256"
          (cd "$(dirname "$archive")" && shasum -a 256 "$(basename "$archive")" > "$(basename "$checksum")")
          {
            printf 'tag=%s\n' "${{ steps.app.outputs.tag }}"
            printf 'version=%s\n' "${{ steps.app.outputs.version }}"
            printf 'archive=%s\n' "$archive"
            printf 'checksum=%s\n' "$checksum"
          } >> "$GITHUB_OUTPUT"

      - name: Upload notarized app to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ steps.package.outputs.tag }}"
          "${{ steps.package.outputs.archive }}"
          "${{ steps.package.outputs.checksum }}"
          --clobber

      - name: Publish Homebrew app cask
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          export GH_TOKEN="$HOMEBREW_TAP_GITHUB_TOKEN"
          gh auth setup-git
          git clone "https://github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" "$tap_dir"
          script/render_homebrew_menubar_cask.sh \
            --version "$VERSION" \
            --sha256 "$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$tap_dir/Casks/bb-menubar.rb"
          ruby -c "$tap_dir/Casks/bb-menubar.rb"
          git -C "$tap_dir" config user.name "bb release bot"
          git -C "$tap_dir" config user.email "actions@users.noreply.github.com"
          git -C "$tap_dir" add Casks/bb-menubar.rb
          if git -C "$tap_dir" diff --cached --quiet; then
            exit 0
          fi
          git -C "$tap_dir" commit -m "chore: update bb-menubar to $VERSION"
          git -C "$tap_dir" push
