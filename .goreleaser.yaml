version: 2

project_name: bb

builds:
  - id: bb
    main: ./cmd/bb
    binary: bb
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X bb-project/internal/cli.buildVersion={{ .Version }} -X bb-project/internal/cli.buildCommit={{ .Commit }} -X bb-project/internal/cli.buildDate={{ .Date }}

archives:
  - id: bb
    ids:
      - bb
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - bb
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

release:
  draft: false

homebrew_casks:
  - repository:
      owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    binaries:
      - bb
    homepage: "https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
    description: "CLI to keep Git repositories consistent across machines."
    commit_author:
      name: bb release bot
      email: actions@users.noreply.github.com
